version: '3.9'

services:
  # ─────────────────────────────────────────────
  # Database migration service
  # Runs Alembic migrations before backend starts
  # ─────────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-migrate
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: [ "python", "-m", "alembic", "upgrade", "head" ]
    networks:
      - studymate-network

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    command: [ "bash", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload" ]
    depends_on:
      - migrate
    networks:
      - studymate-network

  # ─────────────────────────────────────────────
  # React Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studymate-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=AI StudyMate
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      - backend
    networks:
      - studymate-network

volumes:
  backend-data:
  backend-uploads:


networks:
  studymate-network:
    driver: bridge
